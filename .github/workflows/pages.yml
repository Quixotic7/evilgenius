# SPDX-License-Identifier: MPL-2.0
# EvilGenius's site on GitHub Pages: publishes site/ as it is in the tree. Nothing is compiled here: the browser
# emulator (site/try/, tools/eg/make_try.py) and the install page's firmware packages (site/firmware/,
# firmware/release.py) are built locally and committed; a commit that changes them on main deploys them.
#
# Pages must be set once by the owner: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the site (its pages and links, the emulator's files, the releases and their packages)
        run: |
          node site/tools/test_site.mjs
          node site/tools/test_install.mjs

      - name: Assemble (site/ without its tools)
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -r _site/tools
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
