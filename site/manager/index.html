<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVILGENIUS Manager</title>
<meta name="description" content="Back up and restore an M-VAVE FM-1 running EVILGENIUS, edit its sounds live, keep its library, export and import its presets, from the browser over USB.">
<link rel="stylesheet" href="../css/eg.css">
<style>
/* the manager's own: the console that follows the page down, the scene in it, the lists */
.console { position: sticky; top: 0; z-index: 2; background: var(--black); display: flex; gap: calc(var(--px) * 4); align-items: center; }
.console .scene { display: flex; align-items: flex-end; gap: calc(var(--px) * 2); flex: none; min-width: 84px; justify-content: center; }
.console .says { flex: 1; min-width: 0; }
.console .status { margin: 0 0 8px; overflow-wrap: anywhere; }
.console #alert { min-height: 0; margin: 8px 0 0; }
.console .bar { max-width: none; }
.plan h3 { margin-top: 0; }
.plan ul { margin-bottom: 0.6em; }
#presets td:first-child, #presets th:first-child { width: 4.5em; color: var(--grey); }
#presets td:last-child { text-align: right; }
#presets .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
.name { color: var(--white); }
@media (max-width: 640px) { .console .scene { min-width: 0; } .console .scene .prop { display: none; } }
/* the tabs */
.tabs { display: flex; gap: calc(var(--px) * 3); flex-wrap: wrap; margin: calc(var(--px) * 6) 0 calc(var(--px) * 4); }
.tabs button { cursor: pointer; padding: calc(var(--px) * 2) calc(var(--px) * 3); border: var(--px) solid var(--blue); background: var(--black); line-height: 0; }
.tabs button[aria-selected="true"] { border-color: var(--yellow); background: var(--blue); }
.tabs button:hover { background: var(--blue); }
[aria-pressed="true"].key, .seg [aria-pressed="true"] { border-color: var(--yellow); background: var(--blue); }
.seg { display: inline-flex; gap: var(--px); flex-wrap: wrap; }
.seg .key, .edtags .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
/* LIBRARY */
.libbar { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 3); align-items: center; margin: 0 0 calc(var(--px) * 4); }
#lb-table .acts { display: flex; flex-wrap: wrap; gap: var(--px); justify-content: flex-end; }
#lb-table .acts .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
#lb-table td:first-child { white-space: nowrap; width: 6em; }
#lb-table input { width: 12ch; }
/* EDIT */
.edtop { display: flex; flex-direction: column; gap: calc(var(--px) * 2); }
.edwho { color: var(--white); }
.edsrc, .edacts { margin: calc(var(--px) * 2) 0; align-items: center; }
.edname { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 3); align-items: center; margin: calc(var(--px) * 3) 0; }
.edname input { width: 14ch; text-transform: uppercase; }
.edtags { display: inline-flex; gap: var(--px); flex-wrap: wrap; }
.edroute { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 2); align-items: center; padding: calc(var(--px) * 2); border: var(--px) dashed var(--blue); margin: 0 0 calc(var(--px) * 3); position: sticky; top: calc(var(--px) * -3); z-index: 1; background: var(--black); }
.edroute .pads { display: inline-flex; flex-wrap: wrap; gap: var(--px); }
.chip { cursor: grab; padding: var(--px) calc(var(--px) * 2); border: var(--px) solid var(--c, var(--grey)); background: var(--black); line-height: 0; }
.chip[aria-pressed="true"] { background: var(--blue); outline: var(--px) solid var(--yellow); }
.chip.pad { --c: var(--yellow); cursor: pointer; }
.edjump { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 2); margin: 0 0 calc(var(--px) * 3); }
.edjump a { padding: var(--px) calc(var(--px) * 2); border: var(--px) solid var(--blue); line-height: 0; }
.edsec h3 { margin-top: 0; }
.rowl { margin: calc(var(--px) * 2) 0 var(--px); line-height: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: calc(var(--px) * 2); }
.tile { position: relative; padding: calc(var(--px) * 2); border: var(--px) solid var(--blue); background: var(--black); cursor: ns-resize; touch-action: none; user-select: none; min-height: 72px; line-height: 0; }
.tile .tv { display: block; margin-top: calc(var(--px) * 2); min-height: 14px; }
.tile .tb { display: block; height: var(--px); background: var(--lightblue); margin-top: calc(var(--px) * 2); width: 0; }
.tile.moved { border-color: var(--lightblue); }
.tile:hover { background: #0c0b2a; }
.tile.can { border-color: var(--yellow); border-style: dashed; cursor: copy; }
.tile.over { background: var(--blue); }
.tile .rt { position: absolute; top: 2px; right: 2px; display: flex; gap: 2px; }
.rchip { cursor: pointer; padding: 2px; border: 2px solid var(--darkgrey); background: var(--black); line-height: 0; }
.edhelp { position: sticky; bottom: 0; background: var(--black); border-top: var(--px) solid var(--blue); padding: calc(var(--px) * 2) 0; margin: calc(var(--px) * 3) 0 0; min-height: 3.2em; max-width: none; color: var(--white); }
.edpick { position: absolute; z-index: 5; background: var(--black); border: var(--px) solid var(--yellow); padding: calc(var(--px) * 2); max-width: min(560px, calc(100vw - 32px)); }
.edpick .pl { display: flex; flex-wrap: wrap; gap: var(--px); margin-top: calc(var(--px) * 2); max-height: 50vh; overflow: auto; }
.edpick .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
.edpick .key.on { border-color: var(--yellow); background: var(--blue); }
@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .edroute { position: static; }
  #lb-table thead { display: none; }
  #lb-table tr { display: grid; grid-template-columns: 5.5em 1fr; }
  #lb-table td { border-bottom: 0; padding: 4px 6px; }
  #lb-table td:nth-child(3) { grid-column: 2; color: var(--grey); }
  #lb-table td.acts { grid-column: 1 / -1; justify-content: flex-start; border-bottom: 2px solid var(--blue); padding-bottom: 10px; }
}


/* HOME */
.homegrid { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr); gap: calc(var(--px) * 4); }
@media (max-width: 900px) { .homegrid { grid-template-columns: 1fr; } }
.hbrain { display: flex; flex-direction: column; gap: calc(var(--px) * 3); }
.jar { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; }
.jar px-sprite canvas { max-width: 100%; height: auto !important; }
.awake { margin: 0; font-size: 12px; color: var(--grey); }
.awake.on { color: var(--lightgreen); }
.hsays { border-color: var(--green); margin: 0; }
.lab { font-size: 12px; color: var(--lightblue); letter-spacing: 1px; margin: 0 0 6px; }
.hsays .says { font-size: 18px; line-height: 1.4; color: var(--lightgreen); margin: 0; max-width: none; }
.hsays .cur { display: inline-block; width: 0.6em; height: 1em; background: var(--lightgreen); margin-left: 6px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
.hright { display: flex; flex-direction: column; gap: calc(var(--px) * 3); min-width: 0; }
.hright .box { margin: 0; }
.hhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
.voices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--px) * 2); }
.voice { border: var(--px) solid var(--darkgrey); padding: 6px; line-height: 0; }
.voice p { line-height: 1.3; font-size: 12px; margin: 4px 0 0; }
.htracks { display: flex; flex-direction: column; gap: 4px; }
.htrack { display: grid; grid-template-columns: 30px minmax(70px, 130px) 70px minmax(120px, 1fr); gap: 10px; align-items: center; padding: 4px 6px; border: var(--px) solid var(--black); background: var(--black); color: var(--white); font: 13px var(--mono); text-align: left; cursor: pointer; }
.htrack.on { border-color: var(--yellow); background: #0c0b2a; }
.htrack .hn { background: var(--blue); text-align: center; padding: 3px 0; }
.htrack .hwave svg { height: 30px; }
.hsteps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.hsteps i { display: block; height: 16px; border: 2px solid var(--blue); }
.hsteps i.on { background: var(--lightblue); }
.htrack.on .hsteps i.on { background: var(--yellow); }
/* SOUND's pictures */
.edsec .pic { border: var(--px) solid var(--lightblue); margin: 0 0 calc(var(--px) * 2); background: var(--black); }
/* MIX */
.mxcols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--px) * 3); margin: calc(var(--px) * 3) 0; }
@media (max-width: 700px) { .mxcols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mxcol { border: var(--px) solid var(--blue); padding: 8px; }
.mxcol.on { border-color: var(--yellow); }
.mxbars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; height: 220px; }
.mxbar { position: relative; background: repeating-linear-gradient(180deg, #000 0 6px, #2e2c9b 6px 8px); border: 2px solid var(--blue); cursor: ns-resize; touch-action: none; }
.mxbar.cur { border-color: var(--yellow); }
.mxbar i { position: absolute; left: 2px; right: 2px; bottom: 0; }
.mxnames { margin: 4px 0 0; font-size: 11px; color: var(--grey); letter-spacing: 0.9em; }
.mxtrack { margin: 4px 0 0; color: var(--white); font-size: 13px; }


/* SOUND: rows across the window (where, the name and actions, the pages and the sources), the page under them */
#tab-edit:not([hidden]) { display: flex; flex-direction: column; height: 100%; gap: 6px; }
#ed-body:not([hidden]) { display: contents; }
#tab-edit .edtop { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
#tab-edit .edtop .keys, #tab-edit .edacts { gap: 6px; margin: 0; }
#tab-edit .edtop .key, #tab-edit .edacts .key { padding: 3px 8px; box-shadow: none; }
#tab-edit .edrow2 { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
#tab-edit .edname { margin: 0; }
#tab-edit .edroute { position: static; margin: 0; padding: 4px 6px; }
#tab-edit .edjump { margin: 0; }
#tab-edit .edpanel { flex: 1; min-height: 0; overflow: auto; }
#tab-edit .tiles { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
#tab-edit .tile { min-height: 54px; padding: 6px; }
#tab-edit .edsec { padding: 8px 10px; }
#tab-edit .edsec h3 { margin: 0 0 4px; }
/* ---- THE APP (2026-11-15, the mockup "EVILGENIUS Manager: C64 webapp"): the whole window one C64 screen in its light
 * blue border, no page scroll; the F-key bar on top, the status line under, each screen scrolling inside */
html, body { height: 100%; overflow: hidden; }
body.app { background: var(--lightblue); }
.frame { position: fixed; inset: 0; padding: clamp(6px, 1.6vw, 24px); display: flex; }
.scr { flex: 1; min-width: 0; min-height: 0; background: var(--black); display: flex; flex-direction: column; }
.topbar { flex: none; display: flex; align-items: center; gap: calc(var(--px) * 2); flex-wrap: wrap; padding: calc(var(--px) * 2) calc(var(--px) * 3); border-bottom: var(--px) dotted var(--blue); }
.topbar .logo { text-decoration: none; line-height: 0; margin-right: calc(var(--px) * 3); }
.fkeys { display: flex; gap: calc(var(--px) * 2); flex-wrap: wrap; }
.fkeys button { cursor: pointer; padding: calc(var(--px) * 2) calc(var(--px) * 2); border: var(--px) solid var(--blue); background: var(--black); line-height: 0; display: inline-flex; gap: 6px; align-items: center; }
.fkeys button[aria-selected="true"] { border-color: var(--yellow); background: var(--blue); }
.fkeys button:hover { background: var(--blue); }
.topbar .right { margin-left: auto; display: flex; gap: calc(var(--px) * 2); align-items: center; flex-wrap: wrap; }
.pill { font: 12px/1.2 var(--mono); padding: 6px 10px; border: var(--px) solid var(--darkgrey); color: var(--lightgrey); }
.pill.on { border-color: var(--green); color: var(--lightgreen); }
.topbar .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
.view { flex: 1; min-height: 0; overflow: auto; padding: calc(var(--px) * 3) calc(var(--px) * 4); }
.view > section { min-height: 100%; }
.statusline { flex: none; display: flex; align-items: center; gap: calc(var(--px) * 3); border-top: var(--px) dotted var(--blue); padding: calc(var(--px) * 1.5) calc(var(--px) * 3); min-height: 44px; }
.statusline.bad { border-top-color: var(--lightred); } .statusline.good { border-top-color: var(--green); }
.statusline .ready { flex: none; line-height: 0; }
.statusline .says { flex: 1; min-width: 0; display: flex; align-items: center; gap: calc(var(--px) * 3); }
.statusline .status, .statusline #alert { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: none; }
.statusline #alert:empty { display: none; }
.statusline .bar { width: 160px; flex: none; }
.statusline .hint { flex: none; color: var(--grey); font-size: 12px; }
.statusline .scene { display: flex; gap: 4px; align-items: flex-end; flex: none; }
@media (max-width: 760px) { .statusline .hint, .statusline .bar { display: none; } .topbar .logo { display: none; } }
/* the boot, the title, HELP: over everything */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; padding: clamp(6px, 1.6vw, 24px); }
.overlay[hidden] { display: none; }
.boot { background: repeating-linear-gradient(180deg, #706deb 0 14px, #edf171 14px 20px, #2e2c9b 20px 31px, #c46c71 31px 36px, #75cec8 36px 47px, #706deb 47px 59px, #56ac4d 59px 63px, #8e3c97 63px 72px); background-size: 100% 72px; animation: raster 0.35s steps(6) infinite; }
@keyframes raster { to { background-position: 0 72px; } }
@media (prefers-reduced-motion: reduce) { .boot { animation: none; } }
.bootscr { flex: 1; background: var(--blue); padding: clamp(16px, 4vw, 48px); font: clamp(12px, 1.6vw, 18px)/2 var(--mono); color: #b4b2ff; overflow: hidden; }
.bootscr p { margin: 0; max-width: none; white-space: pre-wrap; }
.bootscr .cur { display: inline-block; width: 0.7em; height: 1em; background: #b4b2ff; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
.titlescr { background: var(--lightblue); }
.titlescr .scr { align-items: center; justify-content: center; gap: calc(var(--px) * 4); text-align: center; overflow: hidden; }
.titlescr .press { animation: blink 1.2s steps(2) infinite; }
.helpscr .scr { padding: calc(var(--px) * 5); overflow: auto; }
.helpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: calc(var(--px) * 4); }
.helpgrid section { border: var(--px) solid var(--blue); padding: calc(var(--px) * 3); }
.helpgrid h3 { line-height: 1.4; margin: 0 0 8px; color: var(--yellow); }
.helpgrid dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
.helpgrid dt { color: var(--black); background: var(--lightgrey); padding: 0 5px; border-bottom: 3px solid var(--grey); white-space: nowrap; justify-self: start; }
.helpgrid dd { margin: 0; color: var(--white); }

/* POOL */
.plbody { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: calc(var(--px) * 4); align-items: start; }
@media (max-width: 1000px) { .plbody { grid-template-columns: 1fr; } }
.plgrid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
@media (max-width: 760px) { .plgrid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.plc { position: relative; min-height: 36px; padding: 3px 3px 3px 7px; border: 2px solid #1a1846; background: #06051a; color: var(--grey); font: 10px/1.15 var(--mono); text-align: left; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.plc.used { border-color: var(--blue); background: #0c0b2a; color: var(--white); }
.plc.used::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--grey)); }
.plc.on { border-color: var(--yellow); }
.plc.mv { outline: 2px dashed var(--lightred); }
.plc .pln { color: var(--grey); font-size: 9px; }
.plc .plnm { overflow-wrap: anywhere; }
.plbar { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 3); align-items: center; justify-content: space-between; margin-top: calc(var(--px) * 3); }
.plbar .key, .pjacts .key, .cabgrid .keys .key { padding: var(--px) calc(var(--px) * 2); box-shadow: none; }
.plsel { margin: 0; color: var(--yellow); font-size: 13px; }
.plside { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.plside input { width: 14ch; }
.plside .seg .key { padding: 2px 6px; }
.pllist { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 470px); min-height: 160px; overflow: auto; }
.plsnd { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 8px; padding: 3px 6px 3px 9px; border: 0; border-left: 4px solid var(--c, var(--grey)); background: #0c0b2a; color: var(--white); font: 12px var(--mono); text-align: left; cursor: pointer; }
.plsnd:hover, .plsnd:focus { background: var(--blue); }
.plsnd.in { color: var(--lightblue); }
/* PROJECTS */
.pjbody { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: calc(var(--px) * 4); align-items: start; }
@media (max-width: 900px) { .pjbody { grid-template-columns: 1fr; } }
.pjslots { display: flex; flex-direction: column; gap: 4px; }
.pjslot { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 6px; border: var(--px) solid #1a1846; background: #06051a; color: var(--grey); font: 13px var(--mono); text-align: left; cursor: pointer; }
.pjslot.there { color: var(--white); border-color: var(--blue); }
.pjslot.on { border-color: var(--yellow); background: #0c0b2a; }
.pjslot.cur .pjn { background: var(--green); }
.pjslot .pjn { background: var(--blue); text-align: center; padding: 3px 0; color: var(--white); }
.pjslot input { width: 13ch; }
.pjacts { margin: calc(var(--px) * 3) 0; }
.pjto { margin: 0 0 calc(var(--px) * 3); }
.pjmain { margin: 0; }
.pjright { display: flex; flex-direction: column; gap: calc(var(--px) * 4); min-width: 0; }
.pjshelf { margin: 0; }
.pjshlist { display: grid; gap: var(--px); max-height: 28vh; overflow-y: auto; }
.pjshlist .pjslot { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; }
.pjshlist .pjslot > :nth-child(3) { grid-column: 1 / -1; }
.pjshlist .pjname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pjgrid .key { cursor: default; }
.pjother { margin: 0; }
.pjoslots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.pjother .pjacts { margin-bottom: 0; }
#tab-projects.two .pjnote { display: none; }
#tab-projects.two .pjside .pjacts { margin: calc(var(--px) * 2) 0; }
#tab-projects.two .pjside .pjslot { padding: 3px 6px; }
.pjoslots .pjslot { grid-template-columns: 24px minmax(0, 1fr); gap: 6px; padding: 4px; }
.pjoslots .pjname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#workon, #aspanel { font: 12px var(--mono); color: var(--yellow); }
/* CABINET */
.cabgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: calc(var(--px) * 4); align-items: start; }
@media (max-width: 520px) { .cabgrid { grid-template-columns: 1fr; } }
.cabgrid > .box { margin: 0; min-width: 0; }
.cbver { color: var(--white); font-size: 14px; }
.cbstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.cbstats div { display: flex; flex-direction: column; gap: 2px; border: 2px solid var(--blue); padding: 6px; }
.cbn { font: 20px var(--mono); color: var(--yellow); }
.cbmeter { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 2px; }
.cbmeter i, .cblegend i { display: inline-block; height: 14px; background: #1a1846; }
.cblegend i { width: 14px; vertical-align: -2px; margin: 0 4px 0 10px; }
.cbmeter i.lib, .cblegend i.lib { background: var(--cyan); }
.cbmeter i.prj, .cblegend i.prj { background: var(--lightred); }
.cbkept { display: flex; flex-direction: column; gap: 4px; }
.cbk { display: grid; grid-template-columns: 9em 1fr; gap: 4px 10px; align-items: center; border-bottom: 2px solid #1a1846; padding: 4px 0; font-size: 13px; }
.cbk .keys { grid-column: 1 / -1; gap: 4px; }
.cbk .key { padding: 2px 6px; box-shadow: none; }
.cbdrop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px; border: var(--px) dashed var(--cyan); cursor: pointer; text-align: center; }
.cbdrop.over { background: #0c0b2a; border-color: var(--yellow); }
.cbdest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.cbrows { display: flex; flex-direction: column; gap: 2px; max-height: 36vh; overflow: auto; margin: 0 0 10px; }
.cbrow { display: grid; grid-template-columns: 22px minmax(8em, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13px; padding: 2px 4px; background: #0c0b2a; }
.cbrow.dup { background: #2a0c12; }
#presets td:first-child, #presets th:first-child { width: 4.5em; color: var(--grey); }

/* the transport (the top bar) */
.transport { display: flex; gap: calc(var(--px) * 2); align-items: center; }
.transport .trk { display: inline-flex; gap: 6px; align-items: center; padding: var(--px) calc(var(--px) * 2); box-shadow: none; }

.transport .trr { color: var(--lightred); font-size: 14px; line-height: 1; }
.transport .trk.on { border-color: var(--green); background: #0c2a10; }
#tr-rec.on { border-color: var(--lightred); background: #2a0c12; }
.trinfo { min-width: 12ch; text-align: center; }
.trinfo.on { border-color: var(--green); color: var(--lightgreen); }


/* LIBRARY: the list and the card, the window's height */
#tab-library:not([hidden]) { display: flex; flex-direction: column; height: 100%; }
#tab-library .libbar { flex: none; }
.lbbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: calc(var(--px) * 4); }
@media (max-width: 760px) { .lbbody { grid-template-columns: 1fr; grid-template-rows: minmax(200px, 1fr) auto; } }
.lblist { overflow: auto; border: var(--px) solid var(--blue); padding: 4px; outline: none; }
.lblist:focus { border-color: var(--yellow); }
.lbrow { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto 3.4em; gap: 10px; padding: 3px 8px; cursor: pointer; font: 14px var(--mono); color: var(--white); }
.lbrow:hover { background: #0c0b2a; }
.lbrow.on { background: var(--blue); }

.lbhelp { font-size: 12px; }

/* SOUND, paged */

#tab-edit .edtop .edwho { font-size: 13px; flex-basis: 100%; }

#tab-edit .edin { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: start; }

@media (max-width: 900px) { #tab-edit .edin.withpic { grid-template-columns: 1fr; } }

/* smaller windows: one row of keys on top, a thinner border, everything sized to the height */
.frame, .overlay { padding: clamp(4px, min(1.6vw, 2.2vh), 24px); }
@media (max-width: 1560px) {
  .topbar .logo { display: none; }
  .fkeys px-text, .topbar .right px-text { zoom: 0.8; }
  .fkeys button { padding: 6px 8px; }
  .topbar .right .pill { font-size: 11px; padding: 4px 8px; }
}
@media (max-width: 1320px) { .fkeys px-text, .topbar .right px-text { zoom: 0.7; } .topbar { gap: 6px; padding: 6px 8px; } .fkeys { gap: 5px; } }
.jar px-sprite canvas { max-height: calc(100vh - 470px); width: auto !important; }
.plc { min-height: clamp(26px, calc((100vh - 520px) / 8), 44px); }
.cabgrid { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }

}

/* SOUND's groups: each as wide as its values, side by side */
#tab-edit .edgrps { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: flex-start; }
#tab-edit .edgrp .tiles { grid-template-columns: repeat(min(var(--n, 4), 8), minmax(84px, 100px)); }
@media (max-height: 820px) {
  #tab-edit .edtop px-text, #tab-edit .edacts px-text, #tab-edit .edjump px-text { zoom: 0.8; }
  #tab-edit .edgrp .tiles { grid-template-columns: repeat(min(var(--n, 4), 8), minmax(78px, 92px)); }
}

@media (max-height: 820px) {
  #tab-edit .edgrp { display: flex; gap: 4px; align-items: stretch; }
  #tab-edit .edgrp .rowl { writing-mode: vertical-rl; transform: rotate(180deg); margin: 0; display: flex; align-items: center; }
  #tab-edit .edgrp .rowl px-text { zoom: 0.8; }
}

@media (max-height: 820px) {
  #tab-edit .edsec { padding: 4px 8px; }
  #tab-edit .edsec > h3 { display: none; }
  .voice svg { height: 40px; }
  .htrack { padding: 2px 6px; }
  .hsteps i { height: 12px; }
  .homegrid { gap: 10px; }

}

.cabgrid [hidden], #tab-cabinet .keys [hidden] { display: none; }

@media (max-height: 820px) { #tab-cabinet .foot { display: none; } }


/* SEQUENCE (the design canvas's 09 STEPS, 10 PIANO ROLL, 11 TRACKS): the window's height; the toolbar, the EDIT modes,
 * the view, what is picked, the keyboard (STEPS) */
#tab-seq:not([hidden]) { display: flex; flex-direction: column; height: 100%; gap: 5px; }
#tab-seq [hidden] { display: none !important; }
.sqtop { flex: none; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.sqtop .key, .sqmodes .key, .sqsel .key, .sqinsp .key, .sqtbar .key { padding: 2px 7px; box-shadow: none; font-family: var(--mono); font-size: 13px; line-height: 1.25; }
.sqtop .key.on, .sqtop .key[aria-pressed="true"], .sqmodes .key.on, .sqtbar .key.on { border-color: var(--yellow); background: var(--blue); }
.sqtop select, .sqmodes select { padding: 1px 4px; border-width: 2px; font-size: 12px; }
.sqright { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.sqpats { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; flex: none; }
.sqpats .key { padding: 3px 0; font: 11px var(--mono); box-shadow: none; justify-content: center; color: var(--grey); }
.sqpats .key.used { color: var(--white); border-color: var(--lightblue); }
.sqpats .key.on { border-color: var(--yellow); background: var(--blue); color: var(--yellow); }
@media (max-width: 700px) { .sqpats { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.sqmodes { flex: none; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border-top: 3px dotted var(--blue); border-bottom: 3px dotted var(--blue); padding: 4px 0; }
.sqmodes .lab { margin: 0 4px 0 0; }
.sqmodes .sqlocks { margin-left: 8px; color: var(--cyan); }
.sqmodes .key { display: inline-flex; gap: 5px; align-items: center; }
.sqmodes .key.lk { border-color: var(--cyan); }
.sqmodes kbd { font-size: 10px; padding: 0 3px; }
.sqmodes .sqlksel { max-width: 7.5em; font-size: 11px; padding: 0 2px; background: var(--black); color: var(--white); }
.sqbody { flex: 1; min-height: 0; display: flex; gap: 10px; }
.sqmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sqinsp { flex: 0 1 380px; min-width: 0; overflow: auto; border: var(--px) solid var(--blue); padding: 8px 10px; font-size: 13px; }
.sqinsp h3 { line-height: 1.3; color: var(--yellow); margin: 6px 0 4px; font-size: 13px; }
.sqf { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 3px 0; }
.sqf span { color: var(--grey); font-size: 11px; }
.sqf input, .sqf select, .sqlk input, .sqlk select { width: 7em; padding: 2px 4px; border-width: 2px; font-size: 12px; }
.sqfgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
@media (max-width: 1100px) { .sqfgrid { grid-template-columns: 1fr; } }
.sqlk { display: flex; gap: 4px; align-items: center; margin: 3px 0; }
.sqlk span { flex: 1; }
.sqsel { flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.sqsel .sqst { color: var(--yellow); }
.sqsel .sqsx { color: var(--white); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 200px; }
.sqsel .sqsh { white-space: nowrap; font-size: 12px; }
/* STEPS: the pads */
.sqsteps { display: flex; flex-direction: column; gap: 4px; user-select: none; flex: 1; min-height: 0; }
.sqsrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.sqsl { padding: 0; box-shadow: none; justify-content: center; font: 13px var(--mono); color: var(--grey); }
.sqshead .sqsl { border: 0; align-self: end; font-size: 10px; }
button.sqsl.on { color: var(--yellow); border-color: var(--yellow); }
.sqspads { position: relative; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; touch-action: none; }
.sqsn { font: 10px var(--mono); color: var(--grey); text-align: center; }
.sqsn.beat { color: var(--yellow); }
.sqs { position: relative; height: clamp(26px, calc((100vh - 470px) / 8.6), 64px); padding: 0; border: 2px solid #262363; background: #06051a; cursor: pointer; overflow: hidden; text-align: left; }
.sqs.beat { border-left-color: var(--blue); }
.sqs.on { background: #1a1846; border-color: var(--lightblue); }
.sqs .sqsv { position: absolute; left: 0; right: 0; bottom: 0; background: var(--lightblue); opacity: 0.5; pointer-events: none; }
.sqs .sqsv.lkv { background: var(--cyan); }
.sqs.sel .sqsv { background: var(--yellow); }
.sqs .sqsname { position: absolute; left: 13px; top: 2px; font: 12px var(--mono); color: var(--white); white-space: nowrap; pointer-events: none; }
.sqs .sqsval { position: absolute; right: 4px; bottom: 9px; font: 11px var(--mono); color: var(--white); pointer-events: none; }
.sqs.sel .sqsname { color: var(--yellow); }
.sqs .sqstail { position: absolute; left: 0; bottom: 2px; height: 5px; background: var(--cyan); pointer-events: none; }
.sqs.out { opacity: 0.35; }
.sqs.sel { border-color: var(--yellow); }
.sqs.cur { outline: 2px dashed var(--yellow); outline-offset: 1px; }
.sqs.lk::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; background: var(--yellow); }
.sqsm { justify-self: stretch; width: 11px; z-index: 2; cursor: ew-resize; color: var(--black); background: var(--lightred); font: bold 12px/1 var(--mono); display: flex; align-items: center; justify-content: center; }
.sqsm.start { justify-self: start; } .sqsm.end { justify-self: end; }
.sqsrow:not(.in) .sqsm { background: var(--darkgrey); }
/* STEPS: the keyboard */
.sqkb { flex: none; display: flex; gap: 10px; align-items: stretch; height: clamp(56px, 11vh, 96px); }
.sqkbside { width: 150px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.sqkbside p { margin: 0; font-size: 11px; line-height: 1.3; }
.sqkbside .lab.picked { color: var(--yellow); } .sqkbside .lab.held { color: var(--lightgreen); }
.sqkbkeys { position: relative; flex: 1; min-width: 0; }
.sqkbkeys button { position: absolute; top: 0; padding: 0; border: 2px solid var(--black); box-sizing: border-box; cursor: pointer; }
.sqkbkeys .wk { height: 100%; background: #e6e6e6; }
.sqkbkeys .wk span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: 10px var(--mono); color: var(--black); }
.sqkbkeys .bk { height: 60%; background: #1a1846; z-index: 1; }
.sqkbkeys .on { background: var(--yellow) !important; } .sqkbkeys .held { background: var(--lightgreen) !important; }
/* PIANO ROLL */
.sqrv { display: flex; flex-direction: column; gap: 3px; flex: 1; min-height: 0; }
.sqrr { display: flex; gap: 4px; }
.sqrz { width: 60px; flex: none; color: var(--grey); font-size: 9px; }
.sqrruler, .sqtruler { position: relative; height: 14px; overflow: hidden; }
.sqrruler span, .sqtruler span { position: absolute; top: 0; font: 10px var(--mono); color: var(--lightblue); border-left: 2px solid var(--lightblue); padding-left: 3px; white-space: nowrap; }
.sqrruler .pg, .sqtruler .pg { color: var(--yellow); border-color: var(--yellow); }
.sqrbody { display: flex; gap: 4px; }
.sqrkeys { position: relative; width: 60px; flex: none; overflow: hidden; cursor: ns-resize; touch-action: none; }
.sqrk { position: absolute; left: 0; right: 0; box-sizing: border-box; background: var(--lightgrey); border-bottom: 1px solid var(--grey); color: var(--black); font: 9px var(--mono); padding-left: 3px; overflow: hidden; }
.sqrk.b { background: var(--darkgrey); } .sqrk.on { background: var(--yellow); }
.sqrgrid { position: relative; overflow: hidden; background: #0c0b2a; touch-action: none; cursor: crosshair; }
.sqrrow { position: absolute; left: 0; right: 0; border-bottom: 1px solid #13123a; box-sizing: border-box; }
.sqrrow.b { background: #06051a; }
.sqrl { position: absolute; top: 0; bottom: 0; width: 1px; background: #262363; pointer-events: none; }
.sqrl.bt { width: 2px; background: var(--blue); } .sqrl.pg { width: 3px; background: var(--yellow); }
.sqrshade { position: absolute; top: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
.sqrmark { position: absolute; top: 0; bottom: 0; width: 5px; background: var(--lightred); pointer-events: none; }
.sqrn { position: absolute; padding: 0 0 0 3px; border: 2px solid var(--black); box-sizing: border-box; cursor: pointer; overflow: hidden; text-align: left; font: 10px var(--mono); color: var(--white); }
.sqrn.v0 { background: var(--blue); } .sqrn.v1 { background: var(--lightblue); } .sqrn.v2 { background: #8f8cff; } .sqrn.v3 { background: var(--lightred); }
.sqrn.sel { background: var(--yellow); color: var(--black); border-color: var(--white); }
.sqrn.lk { border-bottom-color: var(--yellow); }
.sqrn .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
.sqrn.sel .grip { background: var(--black); }
.sqrchord { position: absolute; font: 11px var(--mono); color: var(--white); background: var(--black); padding: 0 3px; white-space: nowrap; pointer-events: none; }
.sqrchord.sel { color: var(--yellow); }
.sqrlane { display: flex; gap: 4px; }
.sqrlsel { width: 60px; flex: none; font-size: 10px; padding: 0 2px; border-width: 2px; background: var(--black); color: var(--white); }
.sqrlv { position: relative; height: 38px; border-top: 3px dotted var(--blue); box-sizing: border-box; overflow: hidden; cursor: ns-resize; touch-action: none; }
.sqrlv i { position: absolute; bottom: 2px; background: var(--lightblue); pointer-events: none; }
.sqrlv i.lk { background: var(--cyan); } .sqrlv i.sel { background: var(--yellow); }
.sqrlv span { position: absolute; top: 1px; font: 9px var(--mono); color: var(--grey); pointer-events: none; }
.sqrmini { display: flex; gap: 4px; align-items: center; }
.sqrmini .lab { width: 60px; flex: none; margin: 0; color: var(--grey); font-size: 9px; }
.sqmini { position: relative; height: 20px; background: #06051a; border: 2px solid var(--blue); box-sizing: border-box; cursor: pointer; }
.sqmini.tall { height: 42px; }
.sqmini i { position: absolute; top: 4px; height: 8px; background: var(--lightblue); }
.sqmini.tall i { height: 4px; }
.sqmini i.sel { background: var(--yellow); } .sqmini i.mut { background: var(--darkgrey); }
.sqmini b { position: absolute; top: -2px; bottom: -2px; border: 2px solid var(--yellow); box-sizing: border-box; pointer-events: none; }
/* TRACKS */
.sqtv { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }
.sqtbar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.sqtbar .lab { margin: 0; }
.sqtruler { margin-left: 186px; }
.sqtrows { display: flex; flex-direction: column; gap: 5px; touch-action: none; }
.sqtrow { display: flex; gap: 6px; }
.sqtlab { width: 180px; flex: none; box-sizing: border-box; border: var(--px) solid var(--blue); padding: 4px 6px; display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-content: center; }
.sqtrow.on .sqtlab { border-color: var(--yellow); background: var(--blue); }
.sqtname { grid-column: 1; background: none; border: 0; padding: 0; text-align: left; color: var(--white); font: 13px var(--mono); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sqtinfo { grid-column: 1; font: 11px var(--mono); color: var(--cyan); }
.sqtm { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.sqtm.on { border-color: var(--lightred); color: var(--lightred); }
.sqtlane { position: relative; overflow: hidden; background: #06051a; }
.sqtrow.muted .sqtlane { opacity: 0.45; }
.sqts { position: absolute; top: 6px; bottom: 6px; padding: 0; border: 2px solid var(--lightblue); background: #1a1846; box-sizing: border-box; cursor: pointer; overflow: hidden; text-align: left; }
.sqts i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--lightblue); opacity: 0.5; pointer-events: none; }
.sqts span { position: absolute; left: 3px; top: 2px; font: 11px var(--mono); color: var(--white); white-space: nowrap; pointer-events: none; }
.sqts.sel { border-color: var(--yellow); background: #3a3810; }
.sqts.sel i { background: var(--yellow); }
.sqts.lk::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; background: var(--yellow); }
.sqtband { position: absolute; bottom: 2px; height: 4px; background: var(--cyan); pointer-events: none; }
.sqtml { width: 180px; }

/* the virtual FM-1's screen (HOME) */
.vscreen { width: min(100%, 360px); aspect-ratio: 1; image-rendering: pixelated; border: var(--px) solid var(--cyan); background: #000; }
.jar.virtual px-sprite { display: none; }
.jar.virtual .vscreen { cursor: pointer; }
/* THE DOCK (REMOTE MODE): the FM-1's screen above the whole manager, in the border's colour, centred (the owner's
   mock-up, 2026-11-16); then the manager: THE STRIP, the tabs, the screens */
.frame.docked { flex-direction: column; gap: 8px; }
.dock { position: relative; flex: none; align-self: center; line-height: 0; }
.dock canvas { width: var(--dock, 120px); height: var(--dock, 120px); image-rendering: pixelated; background: #000; cursor: pointer; display: block; border: 6px solid var(--yellow); }
.dock[hidden] { display: none; }
#dock-grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 50%, var(--white) 50%); }
.scr.docked > .strip { order: -1; flex: none; }
.scr.docked > .topbar { border-top: var(--px) dotted var(--blue); }
/* THE STRIP: where the unit is, the status line, and its knobs', black keys' and buttons' jobs now */
.strip { display: flex; flex-direction: column; gap: 3px; padding: 4px 6px; min-width: 0; font-family: var(--mono); }
.strip[hidden] { display: none; }
.sthead { display: flex; gap: 10px; align-items: center; min-width: 0; height: 24px; }
.sthead > b { flex: none; color: var(--yellow); font-size: 15px; letter-spacing: 0.08em; white-space: nowrap; }
.sthead .statusline { flex: 1; min-width: 0; min-height: 0; border: 0; padding: 0; gap: 8px; }
.sthead .statusline .scene, .sthead .statusline .ready, .sthead .statusline .hint { display: none; }
.sthead .statusline .bar { width: 60px; }
.sthead .right { flex: none; display: flex; gap: 4px; align-items: center; }
.sthead .right px-text { zoom: 0.55; } .sthead .right .key { padding: 2px 5px; box-shadow: none; }
.sthead .right .pill { font-size: 10px; padding: 3px 6px; } .sthead .right .trinfo { font-size: 10px; }
.scr.docked > .topbar { padding-top: 4px; padding-bottom: 4px; }
.sthead .statusline .status, .sthead .statusline #alert { font-size: 12px; }
.strow { display: grid; gap: 3px; }
.strow.k { grid-template-columns: repeat(7, minmax(0, 1fr)); } .strow.b { grid-template-columns: repeat(11, minmax(0, 1fr)); } .strow.n { grid-template-columns: repeat(14, minmax(0, 1fr)); }
.stc { border: 2px solid var(--blue); background: #06051a; color: var(--white); font: 10px/1.1 var(--mono); padding: 1px 3px; height: 27px; text-align: left; overflow: hidden; white-space: nowrap; cursor: pointer; touch-action: none; user-select: none; }
.strow.k .stc { cursor: ns-resize; border-color: var(--lightblue); }
.stc i { display: block; font-style: normal; color: var(--cyan); font-size: 9px; }
.stc.none span::after { content: "-"; color: var(--darkgrey); }
.stc.lit { border-color: var(--lightred); } .stc.held { border-color: var(--yellow); background: var(--blue); }
@media (max-width: 1320px) { .scr.docked .fkeys px-text, .scr.docked .topbar .right px-text { zoom: 0.6; } .scr.docked .fkeys button { padding: 5px 6px; } .scr.docked .topbar { padding: 4px 6px; } }
/* MIDI FX and TOOLS (egmfx.js, egtools.js) */
.mfbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.mfbar .lab { margin: 0; } .mfbar .key { padding: 3px 9px; box-shadow: none; font: 13px var(--mono); color: var(--white); }
.mfchain { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin: 6px 0; }
.mfcard { display: flex; flex-direction: column; gap: 2px; padding: 6px; border: var(--px) solid var(--blue); background: #06051a; color: var(--white); font: 13px var(--mono); text-align: left; cursor: pointer; min-height: 62px; overflow: hidden; }
.mfcard.none { color: var(--grey); border-color: #1a1846; } .mfcard.byp { opacity: 0.55; } .mfcard.on { border-color: var(--yellow); background: #0c0b2a; }
.mfcard .mfn { background: var(--blue); color: var(--white); padding: 0 6px; align-self: flex-start; } .mfcard .mfname { font-size: 14px; }
.mfcard .dim { font-size: 10px; white-space: nowrap; }
.mfslot { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mfhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .mfhead .lab { margin: 0; } .mfhead .key { padding: 3px 9px; box-shadow: none; font: 13px var(--mono); color: var(--white); }
.mfrow { display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); gap: 5px; align-items: stretch; }
.mfrow .lab { margin: 0; align-self: center; font-size: 11px; }
#tl-knobs { grid-template-columns: repeat(4, minmax(0, 1fr)) auto; }
.mftile { position: relative; border: var(--px) solid var(--lightblue); background: var(--black); color: var(--white); font-family: var(--mono); text-align: left; padding: 4px 6px 7px; min-height: 44px; cursor: ns-resize; touch-action: none; user-select: none; overflow: hidden; }
.mftile.none { border-color: #1a1846; color: var(--grey); cursor: default; font-size: 11px; display: flex; align-items: center; }
.mftile i { display: block; font-style: normal; font-size: 10px; color: var(--cyan); } .mftile b { display: block; font-size: 16px; font-weight: 400; color: var(--white); }
.mftile u { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--yellow); }
.mftile:focus-visible, .mfcell:focus-visible { outline: none; border-color: var(--yellow); }
.mfrow.lane { grid-template-columns: 90px repeat(16, minmax(0, 1fr)); gap: 3px; }
.mfcell { border: 2px solid var(--blue); background: #06051a; color: var(--white); font: 12px var(--mono); padding: 5px 0; cursor: ns-resize; touch-action: none; user-select: none; }
.mfcell.out { opacity: 0.35; }
.tlsteps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.tlstep { border: 2px solid var(--blue); height: 34px; display: flex; align-items: flex-end; justify-content: center; font: 10px var(--mono); color: var(--grey); background: #06051a; }
.tlstep.was { border-color: var(--lightgrey); } .tlstep.on { background: var(--lightblue); color: var(--black); }
.tlstep.ch { border-color: var(--yellow); } .tlstep.ch.on { background: var(--yellow); } .tlstep.out { opacity: 0.35; }
.tlacts { align-items: center; gap: 8px; } .tlacts .key { padding: 3px 10px; box-shadow: none; font: 13px var(--mono); color: var(--white); }
/* THE PANEL (F9): the virtual FM-1's front, over everything (egpanel.js) */
#panel[hidden] { display: none; }
.pnl { --lcd: clamp(180px, calc(100vh - 400px), 480px); width: min(100%, calc(var(--lcd) + 560px)); margin: 0 auto; box-sizing: border-box; padding: 4px 6px; gap: 8px; background: var(--black); display: flex; flex-direction: column; font-family: var(--mono); }
.scr.docked .pnl { --lcd: 0px; width: 100%; }
.scr.docked .pnlcd { display: none; }
.pngo { display: inline-flex; gap: 4px; } .pngo .key { padding: 2px 8px; box-shadow: none; font: 12px var(--mono); color: var(--cyan); }
.pnj { font-size: 10px; color: var(--lightgreen); min-height: 11px; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: clip; }
.pnkey .pnj { color: var(--blue); font-weight: 700; writing-mode: vertical-rl; transform: rotate(180deg); min-height: 0; margin-bottom: 2px; font-size: 9px; }
#panel .pnkey { flex-direction: column; align-items: center; justify-content: flex-end; }
#panel .pnkey.black .pnj { color: var(--lightgreen); }
#panel .pnbtn { height: 46px; gap: 1px; } #panel .pnknob { padding: 4px 2px; gap: 2px; }
.scr.docked #panel .pnbed { height: 118px; }
.pnhead { display: flex; align-items: center; gap: 14px; }
.pnhead h2 { margin: 0; font: 16px var(--mono); color: var(--yellow); letter-spacing: 0.08em; white-space: nowrap; }
.pnhead .dim { flex: 1; min-width: 0; font-size: 11px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pnhead .key { padding: 2px 10px; box-shadow: none; font: 13px var(--mono); color: var(--white); }
.pnbody { display: flex; gap: 14px; min-height: 0; }
.pnlcd { width: var(--lcd); height: var(--lcd); flex: none; image-rendering: pixelated; background: #000; border: var(--px) solid var(--darkgrey); box-sizing: border-box; }
.pnctl { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.pnknobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pnknob { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border: 2px solid var(--blue); cursor: ns-resize; touch-action: none; user-select: none; }
.pnknob:focus-visible { outline: none; border-color: var(--yellow); }
.pndial { display: block; width: clamp(26px, calc(var(--lcd) / 9), 52px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--lightgrey); background: #1f2124; position: relative; box-sizing: border-box; }
.pndial::after { content: ""; position: absolute; left: calc(50% - 2px); top: 2px; width: 4px; height: 32%; background: var(--white); }
.pnn { font-size: 11px; color: var(--white); white-space: nowrap; }
.pnk { font-size: 10px; color: var(--yellow); min-height: 12px; white-space: nowrap; }
.pnbtns { display: flex; flex-direction: column; gap: 8px; }
.pnrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pnrow.oct { grid-template-columns: repeat(6, 1fr); }
.pnbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; height: clamp(34px, calc(var(--lcd) / 9), 54px); border: 2px solid var(--lightblue); background: #2e3135; cursor: pointer; font-family: var(--mono); touch-action: none; }
.pnbtn .pnn { font-size: 10px; }
.pnbtn.lit { background: var(--lightred); border-color: var(--white); }
.pnbtn.held, .pnkey.held { outline: 3px solid var(--yellow); outline-offset: -3px; }
.pnbtn.latched, .pnkey.latched { outline: 3px dashed var(--yellow); outline-offset: -3px; }
.pnbed { position: relative; height: clamp(110px, calc(100vh - var(--lcd) - 130px), 170px); flex: none; border: 2px solid var(--blue); background: #26282c; }
.pnkey { position: absolute; padding: 0 0 4px; border: 2px solid var(--black); border-radius: 0 0 8px 8px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; font-family: var(--mono); touch-action: none; box-sizing: border-box; }
.pnkey.white { top: 42%; bottom: 0; width: 6.25%; background: #d9dadc; }
.pnkey.black { top: 0; height: 40%; width: 5%; margin-left: -2.5%; background: #55585e; border-radius: 8px; }
.pnkey .pnk { color: var(--black); font-size: 12px; font-weight: 700; }
.pnkey.black .pnk { color: var(--yellow); }
.pnkey.white.lit { background: var(--lightgreen); } .pnkey.black.lit { background: var(--lightred); }

<body class="app">
<div class="frame">
  <div id="dock" class="dock" hidden><canvas id="dock-lcd" width="240" height="240" title="The FM-1 in this browser: a click opens THE FM-1 (F9)" aria-label="The FM-1's screen"></canvas><i id="dock-grip" title="Drag: its size (ALT + [ and ]). Double-click: 120"></i></div>
<div class="scr">
  <div id="strip" class="strip" hidden role="group" aria-label="Where the FM-1 is, and what its knobs, black keys and buttons do there"></div>
  <header class="topbar">
    <a class="logo" href="../" aria-label="EVILGENIUS, the site"><px-text font="big" scale="2" color="lightred" shadow="red">EVIL</px-text> <px-text font="big" scale="2" color="white" shadow="darkgrey">GENIUS</px-text></a>
    <nav class="fkeys" role="tablist" aria-label="Screens (F1..F8, or ALT + 1..8)">
      <button id="t-home" role="tab" aria-selected="true" aria-controls="tab-home" type="button"><px-text font="small" scale="2" color="yellow">F1</px-text><px-text font="big" scale="2" color="white">HOME</px-text></button>
      <button id="t-library" role="tab" aria-selected="false" aria-controls="tab-library" type="button"><px-text font="small" scale="2" color="yellow">F2</px-text><px-text font="big" scale="2" color="white">LIBRARY</px-text></button>
      <button id="t-edit" role="tab" aria-selected="false" aria-controls="tab-edit" type="button"><px-text font="small" scale="2" color="yellow">F3</px-text><px-text font="big" scale="2" color="white">SOUND</px-text></button>
      <button id="t-seq" role="tab" aria-selected="false" aria-controls="tab-seq" type="button"><px-text font="small" scale="2" color="yellow">F4</px-text><px-text font="big" scale="2" color="white">SEQUENCE</px-text></button>
      <button id="t-mix" role="tab" aria-selected="false" aria-controls="tab-mix" type="button"><px-text font="small" scale="2" color="yellow">F5</px-text><px-text font="big" scale="2" color="white">MIX</px-text></button>
      <button id="t-pool" role="tab" aria-selected="false" aria-controls="tab-pool" type="button"><px-text font="small" scale="2" color="yellow">F6</px-text><px-text font="big" scale="2" color="white">POOL</px-text></button>
      <button id="t-projects" role="tab" aria-selected="false" aria-controls="tab-projects" type="button"><px-text font="small" scale="2" color="yellow">F7</px-text><px-text font="big" scale="2" color="white">PROJECTS</px-text></button>
      <button id="t-cabinet" role="tab" aria-selected="false" aria-controls="tab-cabinet" type="button"><px-text font="small" scale="2" color="yellow">F8</px-text><px-text font="big" scale="2" color="white">CABINET</px-text></button>
      <button id="t-mfx" role="tab" aria-selected="false" aria-controls="tab-mfx" type="button"><px-text font="small" scale="2" color="yellow">F9</px-text><px-text font="big" scale="2" color="white">MIDI FX</px-text></button>
      <button id="t-tools" role="tab" aria-selected="false" aria-controls="tab-tools" type="button"><px-text font="small" scale="2" color="yellow">F10</px-text><px-text font="big" scale="2" color="white">TOOLS</px-text></button>
      <button id="t-fm1" role="tab" aria-selected="false" aria-controls="tab-fm1" type="button" title="The unit's own page (ALT + F): EFFECTS, the settings, the keyboard"><px-text font="big" scale="2" color="cyan">FM-1</px-text></button>
    </nav>
    <div class="right">
      <div id="transport" class="transport" role="group" aria-label="Transport"></div>
      <span id="unitpill" class="pill">NO FM-1</span>
      <button id="connect" class="key go" type="button" title="An FM-1 on USB: send projects to it, take them from it"><px-text font="big" scale="2" color="white">CONNECT FM-1</px-text></button>
      <button id="virtual" class="key plain hide" type="button" title="Start the FM-1 in this browser again"><px-text font="big" scale="2" color="cyan">START</px-text></button>
      <button id="workon" class="key plain hide" type="button" title="Put every screen on the other FM-1 (ALT + W)"></button>
      <button id="aspanel" class="key plain hide" type="button" title="REMOTE MODE: the FM-1 on USB plays the one in this browser (ALT + P)"></button>
      <button id="disconnect" class="key plain hide" type="button"><px-text font="big" scale="2" color="white">DISCONNECT</px-text></button>
      <button id="helpkey" class="key plain" type="button" aria-label="Every key (?)"><px-text font="big" scale="2" color="white">?</px-text></button>
    </div>
  </header>

  <main class="view" id="view">
    <div id="nomidi" class="box bad" hidden>
      <p><strong>This browser cannot talk to the FM-1.</strong> It has no Web MIDI. Open this page in Chrome or Edge on a computer.</p>
    </div>
    <section id="tab-home" role="tabpanel" aria-labelledby="t-home"></section>
    <section id="tab-library" role="tabpanel" aria-labelledby="t-library" hidden></section>
    <section id="tab-edit" role="tabpanel" aria-labelledby="t-edit" hidden></section>
    <section id="tab-seq" role="tabpanel" aria-labelledby="t-seq" hidden></section>
    <section id="tab-mix" role="tabpanel" aria-labelledby="t-mix" hidden></section>
    <section id="tab-pool" role="tabpanel" aria-labelledby="t-pool" hidden></section>
    <section id="tab-projects" role="tabpanel" aria-labelledby="t-projects" hidden></section>
    <section id="tab-cabinet" role="tabpanel" aria-labelledby="t-cabinet" hidden></section>
    <section id="tab-mfx" role="tabpanel" aria-labelledby="t-mfx" hidden></section>
    <section id="tab-tools" role="tabpanel" aria-labelledby="t-tools" hidden></section>
    <section id="tab-fm1" role="tabpanel" aria-labelledby="t-fm1" hidden><div id="panel"></div></section>
  </main>

  <footer id="console" class="statusline lit">
    <div class="scene" aria-hidden="true">
      <px-sprite id="actor" name="AGENT_STAND" scale="2"></px-sprite>
      <px-sprite id="prop" class="prop" name="CABINET" scale="2"></px-sprite>
    </div>
    <span class="ready"><px-text font="big" scale="2" color="white">READY.</px-text></span>
    <div class="says">
      <p id="status" class="status" role="status" aria-live="polite">Starting.</p>
      <p id="alert" class="status err" role="alert"></p>
    </div>
    <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="barfill"></i></div>
    <span class="hint" id="hint">F1..F8 THE SCREENS · ? EVERY KEY</span>
  </footer>
</div>
</div>

<div id="boot" class="overlay boot" hidden aria-hidden="true">
  <div class="bootscr"><div id="boot-lines"></div></div>
</div>

  <div class="scr">
    <px-sprite name="GENIUS_BIG" scale="4"></px-sprite>
    <div><px-text font="big" scale="6" color="lightred" shadow="red">EVIL</px-text></div>

</div>

  <div class="scr">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
      <px-sprite name="GENIUS_HA" scale="3"></px-sprite>
      <h2 id="help-h" style="margin:0"><px-text font="big" scale="3" color="yellow">EVERY KEY</px-text></h2>
      <button id="help-close" class="key plain" type="button" style="margin-left:auto"><px-text font="big" scale="2" color="white">ESC</px-text></button>
    </div>
    <div class="helpgrid" id="help-grid"></div>
  </div>
</div>
</body>
